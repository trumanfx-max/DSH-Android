name: build-apk-v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null || true
      - name: Native prebuilt libs
        run: bash native/prebuilt.sh fetch
      - name: Build engine
        run: OUT_DIR="$RUNNER_TEMP/engineOut" bash js/build-engine.sh
      - name: Assemble APK
        run: ./gradlew :app:assembleDebug -Pdsh.engineOut="$RUNNER_TEMP/engineOut" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-ru
          path: app/build/outputs/apk/debug/*.apk
