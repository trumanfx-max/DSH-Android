name: build-apk-v5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null || true
      - name: Native prebuilt libs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash native/prebuilt.sh fetch
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ../toolchains/out/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -l app/src/main/jniLibs/arm64-v8a
      - name: Build engine
        run: OUT_DIR="$RUNNER_TEMP/engineOut" bash js/build-engine.sh
      - name: Assemble APK
        run: ./gradlew :app:assembleDebug -Pdsh.engineOut="$RUNNER_TEMP/engineOut" --no-daemon
      - name: Verify libnode present
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libnode.so
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag: ru-build-1
          name: DSH RU build 1
          body: DSH APK with Russian localization (values-ru)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
