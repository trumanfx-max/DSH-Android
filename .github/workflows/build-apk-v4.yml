name: build-apk-v4
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null || true
      - name: Native prebuilt libs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash native/prebuilt.sh fetch
          ls -l ../toolchains/out/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ../toolchains/out/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -l app/src/main/jniLibs/arm64-v8a
      - name: Build engine
        run: OUT_DIR="$RUNNER_TEMP/engineOut" bash js/build-engine.sh
      - name: Assemble APK
        run: ./gradlew :app:assembleDebug -Pdsh.engineOut="$RUNNER_TEMP/engineOut" --no-daemon
      - name: Verify APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c "libnode.so"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-apk-ru-v4
          path: app/build/outputs/apk/debug/*.apk
